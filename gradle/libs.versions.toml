[versions]
agp = "9.3.0"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
constraintlayout = "2.1.4"
recyclerview = "1.3.2"
lifecycle = "2.8.7"
coroutines = "1.10.2"
activity = "1.9.3"
# Kotlin-BLE-Library 2.0：与参考项目 nRF Toolbox 4.4.1 同代 API。
# 版本受项目 Kotlin（AGP 9.3 内置 2.2.10）约束：beta 版用 Kotlin 2.4 编译无法消费，
# alpha19 为 Kotlin 2.3.20 编译，是当前可用的最高版本。
nordicBle = "2.0.0-alpha19"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
# androidx 已将 -ktx 扩展并入主模块（activity-ktx 1.9.0 起、lifecycle-*-ktx 2.8.0 起为空壳），直接声明主模块坐标
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
nordic-ble-client = { group = "no.nordicsemi.kotlin.ble", name = "client-android", version.ref = "nordicBle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

